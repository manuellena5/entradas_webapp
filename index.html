<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Entradas en la cancha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fuentes: van dentro de la app para que abra sin señal (licencia OFL, ver fonts/) */
@font-face { font-family: 'Barlow'; font-weight: 400; font-style: normal; font-display: block; src: url('fonts/barlow-400.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 600; font-style: normal; font-display: block; src: url('fonts/barlow-600.woff2') format('woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 700; font-style: normal; font-display: block; src: url('fonts/barlow-700.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal; font-display: block; src: url('fonts/barlow-condensed-700.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal; font-display: block; src: url('fonts/ibm-plex-mono-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 600; font-style: normal; font-display: block; src: url('fonts/ibm-plex-mono-600.woff2') format('woff2'); }

:root {
  /* Colores (DISENO.md) */
  --fondo: #EEF0EA;
  --superficie: #FFFFFF;
  --tinta: #12161C;
  --texto-2: #4A5560;
  --texto-2-gris: #3A444D;
  --texto-2-barra: #C9CFC6;
  --panel: #DDE1D7;
  --gratis: #D3D9CC;
  --verde: #1C6B43;
  --rojo: #A32A1E;
  --aviso: #FBE9C4;
  --papel-borde: #8A938A;
  --velo: rgba(18, 22, 28, 0.6);

  /* Botones de entrada, por posición */
  --e1-bg: #1E4E8C; --e1-fg: #FFFFFF;
  --e2-bg: #F2B33D; --e2-fg: #12161C;
  --e3-bg: #0E6E6E; --e3-fg: #FFFFFF;
  --e4-bg: #7A2E5D; --e4-fg: #FFFFFF;

  /* Familias */
  --f-texto: 'Barlow', system-ui, sans-serif;
  --f-titulo: 'Barlow Condensed', 'Barlow', sans-serif;
  --f-papel: 'IBM Plex Mono', ui-monospace, monospace;

  /* Medidas */
  --alto-entrada: 172px;
  --alto-entrada-chico: 124px;
  --alto-extra: 112px;
  --alto-gratis: 68px;
  --alto-cobrar: 84px;
  --alto-tabs: 64px;
  --alto-campo: 56px;
  --separacion: 10px;
  --margen: 16px;
  --radio-entrada: 18px;
  --radio-gratis: 14px;
  --radio-cobrar: 16px;
  --radio-campo: 12px;
  --radio-panel: 22px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--f-texto);
  font-size: 17px;
  line-height: 1.3;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
input { font-family: inherit; user-select: text; -webkit-user-select: text; }
html { touch-action: manipulation; }
#app { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

#app {
  position: relative;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--fondo);
}

/* ---------- Comunes ---------- */
.pantalla {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
}
.desplaza { flex: 1; min-height: 0; overflow-y: auto; }
.rotulo { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--texto-2); }
.rotulo-panel { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-2-gris); }
.titulo-inicio { margin: 0; font-family: var(--f-titulo); font-weight: 700; font-size: 42px; line-height: 0.95; text-transform: uppercase; }
.condensada { font-family: var(--f-titulo); font-weight: 700; text-transform: uppercase; }
.campo { display: flex; flex-direction: column; gap: 8px; }
.campo label, .etiqueta { font-size: 17px; font-weight: 600; }
.campo input {
  height: var(--alto-campo); border: 2px solid var(--tinta); border-radius: var(--radio-campo);
  background: var(--superficie); color: var(--tinta); padding: 0 16px; font-size: 22px; font-weight: 600; width: 100%;
}
.ayuda { font-size: 15px; color: var(--texto-2); }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--separacion); }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opcion { border: 2px solid var(--tinta); background: var(--superficie); color: var(--tinta); }
.opcion[aria-pressed="true"] { background: var(--tinta); color: #FFFFFF; }
.error {
  padding: 10px 14px; border: 2px solid var(--rojo); border-radius: 10px;
  background: var(--superficie); color: var(--rojo); font-size: 17px; font-weight: 700;
}
.error[hidden] { display: none; }
.boton-grande {
  flex-shrink: 0; border: 0; border-radius: var(--radio-cobrar); color: #FFFFFF;
  font-family: var(--f-titulo); font-weight: 700; text-transform: uppercase;
}
.version { font-size: 11px; color: var(--texto-2); text-align: right; }

/* ---------- Abrir caja ---------- */
.abrir { gap: 16px; padding: 24px 20px 8px; overflow-y: auto; }
.b-lugar { height: 80px; border-radius: 16px; font-family: var(--f-titulo); font-weight: 700; font-size: 32px; text-transform: uppercase; }
.precios { padding: 12px 16px 8px; border-radius: 12px; background: var(--panel); }
.precios .rotulo-panel { padding-bottom: 6px; }
.precios .fila { display: flex; justify-content: space-between; padding: 3px 0; font-size: 18px; }
.precios .fila b { font-weight: 700; }
.relleno { flex: 1; min-height: 4px; }
.b-abrir { height: 72px; background: var(--verde); font-size: 34px; letter-spacing: 0.02em; }

/* ---------- Vender ---------- */
.barra { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--tinta); color: #FFFFFF; }
.barra-izq { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.barra-titulo { font-family: var(--f-titulo); font-weight: 700; font-size: 26px; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-sub { font-size: 14px; color: var(--texto-2-barra); }
.b-alias { flex-shrink: 0; height: 44px; padding: 0 14px; border: 2px solid #FFFFFF; border-radius: 10px; background: transparent; color: #FFFFFF; font-size: 16px; font-weight: 700; }
.ingresaron { text-align: right; flex-shrink: 0; }
.ingresaron .n { font-family: var(--f-titulo); font-weight: 700; font-size: 30px; line-height: 1; }
.ingresaron .barra-sub { font-size: 13px; }

.zona-botones { padding: 12px 12px 2px; }
.grilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--separacion); padding-bottom: var(--separacion); }
.celda { position: relative; }
.b-venta { width: 100%; overflow: hidden; text-align: left; }
.b-venta .nombre { font-family: var(--f-titulo); font-weight: 700; line-height: 0.95; text-transform: uppercase; overflow-wrap: anywhere; }
.b-entrada {
  height: var(--alto-entrada); border: 0; border-radius: var(--radio-entrada);
  background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; padding: 14px;
}
.b-entrada.chico { height: var(--alto-entrada-chico); }
.b-entrada .nombre { font-size: 42px; }
.b-entrada .precio { font-size: 22px; font-weight: 600; }
.b-extra {
  height: var(--alto-extra); border: 2px solid var(--tinta); border-radius: var(--radio-entrada);
  background: var(--superficie); color: var(--tinta);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2px; padding: 12px 14px;
}
.b-extra .nombre { font-size: 34px; }
.b-extra .precio { font-size: 19px; font-weight: 600; }
.b-gratis {
  height: var(--alto-gratis); border: 0; border-radius: var(--radio-gratis); background: var(--gratis); color: var(--tinta);
  display: flex; align-items: center; padding: 0 14px;
}
.b-gratis .nombre { font-size: 28px; }
.contador { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.contador.derecha { top: 11px; left: auto; gap: 6px; }
/* Extras: número arriba y "−" abajo, contra el borde, para no tapar el nombre */
.contador.vertical { top: 6px; bottom: 6px; left: auto; right: 6px; flex-direction: column; justify-content: space-between; }
.b-extra.con-cuenta { padding-right: 52px; }
.b-gratis.con-cuenta { padding-right: 118px; }
.grilla.una { grid-template-columns: minmax(0, 1fr); }
.cuenta {
  min-width: 50px; height: 50px; padding: 0 10px; border-radius: 25px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-titulo); font-weight: 700; font-size: 34px;
}
.menos { pointer-events: auto; width: 50px; height: 50px; border-radius: 25px; border: 2px solid; font-size: 30px; font-weight: 700; line-height: 1; padding: 0; }
.chica .cuenta { min-width: 46px; height: 46px; border-radius: 23px; font-size: 30px; }
.chica .menos { width: 46px; height: 46px; border-radius: 23px; font-size: 28px; }
.franja { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: 2px solid var(--tinta); background: var(--superficie); }
.franja-izq { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.resumen { font-size: 15px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.total { font-family: var(--f-titulo); font-weight: 700; font-size: 44px; line-height: 1; }
.b-chico { height: 48px; padding: 0 16px; border: 2px solid var(--tinta); border-radius: 12px; background: var(--superficie); color: var(--tinta); font-size: 17px; font-weight: 700; }
.cobrar { padding: 10px 12px 12px; background: var(--superficie); }
.cobrar .boton-grande { width: 100%; height: var(--alto-cobrar); font-size: 32px; }
.cobrar .boton-grande:disabled { opacity: 0.4; cursor: default; }
.b-efectivo { background: var(--verde); }
.b-oscuro { background: var(--tinta); }
.cobrar .b-transf { font-size: 28px; }
.vender-error { padding: 8px 12px 0; background: var(--superficie); }

/* ---------- Paneles ---------- */
.velo { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; background: var(--velo); }
.panel {
  display: flex; flex-direction: column; gap: 14px; max-height: calc(100% - 24px); overflow-y: auto;
  padding: 20px 16px 16px; border-radius: var(--radio-panel) var(--radio-panel) 0 0; background: var(--superficie);
}
.panel-titulo { font-family: var(--f-titulo); font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase; }
.cobrado-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cobrado-cabeza .izq { display: flex; align-items: center; gap: 10px; }
.cobrado-cabeza .medio { font-size: 15px; color: var(--texto-2); }
.cobrado-cabeza .monto { font-family: var(--f-titulo); font-weight: 700; font-size: 44px; line-height: 1; }
.etiqueta-2 { font-size: 15px; font-weight: 600; color: var(--texto-2); }
.tickets { flex-shrink: 0; max-height: 300px; overflow-y: auto; padding: 14px 12px 4px; border-radius: 12px; background: var(--panel); }
.ticket {
  width: 232px; margin: 0 auto 10px; display: flex; flex-direction: column; align-items: center;
  padding: 14px 12px 12px; background: var(--superficie); border-bottom: 2px dashed var(--papel-borde);
  font-family: var(--f-papel); font-size: 13px; line-height: 1.4; text-align: center;
}
.ticket .fuerte { font-weight: 600; }
.ticket .t-titulo { margin-top: 6px; font-weight: 600; font-size: 19px; }
.ticket .t-detalle { font-weight: 600; font-size: 17px; }
.ticket .t-cuerpo { align-self: stretch; margin: 6px 0 4px; padding: 4px 0; border-top: 1px dashed var(--tinta); border-bottom: 1px dashed var(--tinta); text-align: left; }
.ticket .t-cuerpo div { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.ticket .t-precio { font-size: 17px; font-weight: 600; }
.ticket .t-pie { margin-top: 6px; }
.nota { padding: 10px 14px; border-radius: 10px; background: var(--aviso); font-size: 17px; font-weight: 600; }
.notas { display: flex; flex-direction: column; gap: 6px; }
.panel .campo { gap: 6px; }
.panel .campo label { font-size: 16px; }
.panel .campo input { height: 58px; padding: 0 14px; font-size: 21px; }
.chip { height: 52px; border-radius: 12px; font-size: 18px; font-weight: 700; }
.renglon-gris { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 14px; border-radius: 12px; background: var(--panel); }
.renglon-gris span:first-child { font-size: 18px; font-weight: 600; }
.renglon-gris .condensada { font-size: 38px; line-height: 1; }
.b-siguiente { height: 76px; background: var(--tinta); font-size: 34px; }
.dato { display: flex; flex-direction: column; gap: 2px; }
.dato .que { font-size: 15px; font-weight: 600; color: var(--texto-2); }
.dato .alias { font-family: var(--f-titulo); font-weight: 700; font-size: 44px; line-height: 1; overflow-wrap: anywhere; }
.dato .valor { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.b-cerrar-panel { height: 72px; background: var(--tinta); font-size: 32px; }

#aviso-version {
  position: fixed; left: 50%; bottom: 12px; z-index: 30;
  transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 456px; min-height: 56px;
  padding: 10px 16px; border: 0; border-radius: var(--radio-campo);
  background: var(--tinta); color: #FFFFFF;
  font-size: 17px; font-weight: 700; text-align: center;
}
#aviso-version[hidden] { display: none; }
</style>

<body>
<div id="app"></div>
<button type="button" id="aviso-version" hidden>Hay una versión nueva. Tocá para actualizar.</button>

<script id="reglas">
// Reglas puras: no tocan la página. tests.html las carga desde acá.

// Plata en enteros. Formato "$ 10.000".
function plata(n) {
  const v = Math.round(Number(n) || 0);
  const signo = v < 0 ? '-' : '';
  return signo + '$ ' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// Plural de un nombre: vocal → "s"; termina en "s" → igual; si no → "es".
function enPlural(nombre) {
  const ultima = nombre.slice(-1).toLowerCase();
  if (!ultima || ultima === 's') return nombre;
  return nombre + ('aeiouáéíóú'.indexOf(ultima) >= 0 ? 's' : 'es');
}

// "1 Hombre", "2 Hombres"
function cantidadDe(q, nombre) {
  return q + ' ' + (q === 1 ? nombre : enPlural(nombre));
}

function dosCifras(n) { return (n < 10 ? '0' : '') + n; }

// Fecha guardada en ISO; se muestra en hora local.
function fechaTxt(iso) {
  const d = new Date(iso);
  return dosCifras(d.getDate()) + '/' + dosCifras(d.getMonth() + 1) + '/' + d.getFullYear();
}
function horaTxt(iso) {
  const d = new Date(iso);
  return dosCifras(d.getHours()) + ':' + dosCifras(d.getMinutes());
}
function fechaHoraTxt(iso) { return fechaTxt(iso) + ' ' + horaTxt(iso); }

// ---------- Botones ----------

const GRUPOS = ['entrada', 'extra', 'gratis'];

function botonesDeFabrica() {
  const b = (id, nombre, grupo, precio, ticket, titulo, aviso, orden) =>
    ({ id, nombre, grupo, precio, precioSocio: precio, visible: true, ticket, titulo, aviso, orden });
  return [
    b('hombre', 'Hombre', 'entrada', 10000, 'venta', 'ENTRADA GENERAL', '', 1),
    b('mujer', 'Mujer', 'entrada', 7000, 'venta', 'ENTRADA GENERAL', '', 2),
    b('tribuna', 'Tribuna', 'extra', 2000, 'persona', 'TRIBUNA', '', 1),
    b('sorteo', 'Sorteo', 'extra', 2000, 'no', 'SORTEO', 'Entregá números del sorteo', 2),
    b('jugador', 'Jugador', 'gratis', 0, 'no', 'SIN CARGO', '', 1),
    b('menor', 'Menor', 'gratis', 0, 'no', 'SIN CARGO', '', 2)
  ];
}

// Por grupo (entrada, extra, gratis) y dentro del grupo por orden.
function ordenarBotones(botones) {
  return botones.slice().sort((a, b) =>
    (GRUPOS.indexOf(a.grupo) - GRUPOS.indexOf(b.grupo)) || (a.orden - b.orden));
}

// De visitante no se venden los extras.
function botonesParaVender(botones, condicion) {
  return ordenarBotones(botones).filter((b) => b.visible && (condicion === 'local' || b.grupo !== 'extra'));
}

function precioDe(boton, socio) {
  if (boton.grupo === 'gratis') return 0;
  return socio && boton.grupo === 'entrada' ? boton.precioSocio : boton.precio;
}

// Total y cantidad de lo cargado, antes de cobrar.
function totalCarrito(botones, carrito, socio) {
  let total = 0;
  let cantidad = 0;
  botones.forEach((b) => {
    const q = carrito[b.id] || 0;
    total += q * precioDe(b, socio);
    cantidad += q;
  });
  return { total, cantidad };
}

// "2 Hombres · 1 Mujer · 2 Tribunas"
function resumenLineas(lineas) {
  return lineas.map((l) => cantidadDe(l.cantidad, l.nombre)).join(' · ');
}

// ---------- Venta y tickets ----------

const MEDIOS = { efectivo: 'Efectivo', transferencia: 'Transferencia', sin_cargo: 'Sin cargo' };

function numeroTicket(n) { return String(n).padStart(4, '0'); }

// Arma una venta con sus tickets. No guarda nada.
// op = { id, medio: 'efectivo' | 'transferencia', socio, ultimoTicket, ahora (ISO) }
// Devuelve { venta, ultimoTicket } o null si no hay nada cargado.
function armarVenta(botones, carrito, op) {
  const socio = !!op.socio;
  const lineas = [];
  ordenarBotones(botones).forEach((b) => {
    const cantidad = carrito[b.id] || 0;
    if (cantidad <= 0) return;
    const precioUnitario = precioDe(b, socio);
    lineas.push({
      botonId: b.id, nombre: b.nombre, grupo: b.grupo, ticket: b.ticket, titulo: b.titulo,
      aviso: b.aviso || '', cantidad, precioUnitario, subtotal: precioUnitario * cantidad
    });
  });
  if (!lineas.length) return null;

  const total = lineas.reduce((s, l) => s + l.subtotal, 0);
  const esSocio = (l) => socio && l.grupo === 'entrada';
  const tickets = [];

  // Un ticket combinado con todas las líneas "uno por venta".
  const juntas = lineas.filter((l) => l.ticket === 'venta');
  if (juntas.length) {
    const mismo = juntas.every((l) => l.titulo === juntas[0].titulo);
    tickets.push({
      clase: 'combinado',
      titulo: (mismo ? juntas[0].titulo : 'COMPROBANTE') + (juntas.some(esSocio) ? ' · SOCIO' : ''),
      detalle: '',
      cuerpo: juntas.map((l) => ({
        texto: l.cantidad + ' ' + l.nombre.toUpperCase(),
        monto: l.subtotal ? plata(l.subtotal) : 's/cargo'
      })),
      total: juntas.reduce((s, l) => s + l.subtotal, 0)
    });
  }

  // Un ticket individual por cada unidad de las líneas "uno por persona".
  lineas.filter((l) => l.ticket === 'persona').forEach((l) => {
    const nombre = l.nombre.toUpperCase();
    let detalle = nombre === l.titulo ? '' : nombre;
    if (esSocio(l)) detalle = detalle ? detalle + ' · SOCIO' : 'SOCIO';
    for (let i = 0; i < l.cantidad; i++) {
      tickets.push({ clase: 'individual', titulo: l.titulo, detalle, cuerpo: [], total: l.precioUnitario });
    }
  });

  let n = op.ultimoTicket || 0;
  tickets.forEach((t) => { n += 1; t.numero = n; });

  return {
    venta: {
      id: op.id, fechaHora: op.ahora, medio: total > 0 ? op.medio : 'sin_cargo', total, socio,
      pagador: '', anuladaEn: null, lineas, tickets
    },
    ultimoTicket: n
  };
}

// "Efectivo", "Transferencia de Juan", "Sin cargo"
function medioTxt(venta) {
  const txt = MEDIOS[venta.medio] || '';
  return venta.medio === 'transferencia' && venta.pagador ? txt + ' de ' + venta.pagador : txt;
}

// Recordatorios después de cobrar.
function avisosDeVenta(venta) {
  const avisos = [];
  const sinTicket = [];
  venta.lineas.forEach((l) => {
    if (l.aviso) avisos.push(l.aviso + ': ' + l.cantidad);
    else if (l.ticket === 'no') sinTicket.push(cantidadDe(l.cantidad, l.nombre));
  });
  if (sinTicket.length) avisos.push('Anotado sin ticket: ' + sinTicket.join(' · ') + '.');
  if (venta.medio === 'transferencia') avisos.push('Pedí ver el comprobante de la transferencia.');
  return avisos;
}

// Billetes con los que puede pagar: el total redondeado hacia arriba a
// 10.000, 20.000, 50.000 y 100.000; mayores que el total, sin repetir, los tres primeros.
function sugerenciasDePago(total) {
  const out = [];
  [10000, 20000, 50000, 100000].forEach((b) => {
    const arriba = Math.ceil(total / b) * b;
    if (arriba > total && out.indexOf(arriba) < 0) out.push(arriba);
  });
  return out.slice(0, 3);
}

// ---------- Caja ----------

// Los botones se copian al abrir: el cierre de una caja no cambia
// aunque después se cambie la configuración.
function nuevaCaja(op) {
  return {
    id: op.ahora, abiertaEn: op.ahora, cerradaEn: null,
    condicion: op.condicion, rival: op.rival || '', fondo: Math.max(0, Math.round(Number(op.fondo) || 0)),
    efectivoContado: null, ultimoTicket: 0,
    botones: JSON.parse(JSON.stringify(op.botones)),
    ventas: []
  };
}

// Devuelve una caja nueva con la venta anulada. No libera los números de ticket.
function anularVenta(caja, ventaId, ahora) {
  return Object.assign({}, caja, {
    ventas: caja.ventas.map((v) => (v.id === ventaId && !v.anuladaEn ? Object.assign({}, v, { anuladaEn: ahora }) : v))
  });
}

// Informe de cierre. Todo sale de las ventas no anuladas, con la copia guardada en cada una.
function calcularCierre(caja, botones) {
  const acum = {};
  let efectivo = 0;
  let transferencia = 0;
  let anuladas = 0;
  let anuladoMonto = 0;
  const transferencias = [];

  caja.ventas.forEach((v) => {
    if (v.anuladaEn) { anuladas += 1; anuladoMonto += v.total; return; }
    if (v.medio === 'efectivo') efectivo += v.total;
    if (v.medio === 'transferencia') {
      transferencia += v.total;
      transferencias.push({ hora: horaTxt(v.fechaHora), nombre: v.pagador || 'Sin nombre', monto: v.total });
    }
    v.lineas.forEach((l) => {
      const a = acum[l.botonId] || (acum[l.botonId] = { nombre: l.nombre, grupo: l.grupo, cantidad: 0, monto: 0 });
      a.cantidad += l.cantidad;
      a.monto += l.subtotal;
    });
  });

  const local = caja.condicion === 'local';
  const filas = { entrada: [], extra: [], gratis: [] };
  const fila = (nombre, a) => ({ nombre: enPlural(nombre), cantidad: a ? a.cantidad : 0, monto: a ? a.monto : 0 });
  const vistos = {};
  ordenarBotones(botones).forEach((b) => {
    vistos[b.id] = true;
    const a = acum[b.id];
    if (!a && !b.visible) return;                       // oculto y sin ventas: no aparece
    if (!a && b.grupo === 'extra' && !local) return;    // de visitante no hay extras
    filas[b.grupo].push(fila(a ? a.nombre : b.nombre, a));
  });
  Object.keys(acum).forEach((id) => {
    if (!vistos[id]) filas[acum[id].grupo].push(fila(acum[id].nombre, acum[id]));
  });

  const suma = (lista, campo) => lista.reduce((s, f) => s + f[campo], 0);
  const fondo = caja.fondo || 0;
  return {
    entradas: filas.entrada,
    entradasCantidad: suma(filas.entrada, 'cantidad'),
    entradasMonto: suma(filas.entrada, 'monto'),
    extras: filas.extra,
    gratis: filas.gratis,
    personas: suma(filas.entrada, 'cantidad') + suma(filas.gratis, 'cantidad'),
    efectivo, transferencia, transferencias,
    total: efectivo + transferencia,
    fondo,
    esperado: fondo + efectivo,
    anuladas, anuladoMonto
  };
}

// ---------- Guardado ----------
// Cada clave guarda { formato, datos } para poder migrar si cambia la forma.

const FORMATO = 1;
const CLAVES = { config: 'entradas_config', caja: 'entradas_caja', historial: 'entradas_historial' };

function configInicial() {
  return {
    club: 'Club Deportivo Mitre',
    sociosActivo: false,
    transf: { alias: '', titular: '', banco: '' },
    botones: botonesDeFabrica()
  };
}

// almacen: localStorage en la app; uno de mentira en las pruebas.
function crearGuardado(almacen) {
  const escribir = (clave, datos) => {
    try {
      almacen.setItem(clave, JSON.stringify({ formato: FORMATO, datos }));
      return true;
    } catch (e) {
      return false;
    }
  };
  const leer = (clave) => {
    let txt = null;
    try { txt = almacen.getItem(clave); } catch (e) { return undefined; }
    if (txt === null) return undefined;
    try {
      const o = JSON.parse(txt);
      if (o && o.formato === FORMATO) return o.datos;
    } catch (e) { /* abajo */ }
    // No se entiende lo guardado: se aparta una copia para no pisarla.
    try { almacen.setItem(clave + '_danado', txt); } catch (e) { /* nada */ }
    return undefined;
  };
  return {
    config() {
      const c = leer(CLAVES.config);
      if (c) return c;
      const nueva = configInicial();
      escribir(CLAVES.config, nueva);
      return nueva;
    },
    caja() { return leer(CLAVES.caja) || null; },
    historial() { return leer(CLAVES.historial) || []; },
    guardarConfig(c) { return escribir(CLAVES.config, c); },
    guardarCaja(c) { return escribir(CLAVES.caja, c); },
    guardarHistorial(h) { return escribir(CLAVES.historial, h); }
  };
}
</script>

<script>
const APP_VERSION = 'v3';

const G = crearGuardado(localStorage);
let config = G.config();
let caja = G.caja();

// Lo que no se guarda: el carrito a medio cargar se puede perder.
const ui = {
  abrir: { condicion: 'local', rival: '', fondo: '' },
  carrito: {},
  cobrando: false,     // bloquea el doble cobro hasta tocar "Siguiente"
  cobrada: null,       // id de la venta que muestra el panel Cobrado
  pagaCon: 0,
  alias: false,
  error: ''
};

const app = document.getElementById('app');
const COLORES_ENTRADA = [1, 2, 3, 4].map((n) => ({ bg: 'var(--e' + n + '-bg)', fg: 'var(--e' + n + '-fg)', claro: n !== 2 }));

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const partidoTxt = (rival) => (rival ? 'vs. ' + rival : 'Partido de hoy');
const condicionTxt = (c) => (c === 'local' ? 'Local' : 'Visitante');
const soloNumero = (txt) => Math.round(Number(String(txt).replace(/\D/g, '')) || 0);
const ahora = () => new Date().toISOString();

// ---------- Pantallas ----------

function pantallaAbrir() {
  const a = ui.abrir;
  const precios = botonesParaVender(config.botones, a.condicion).filter((b) => b.grupo !== 'gratis');
  return `
  <div class="pantalla abrir">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div class="rotulo">${esc(config.club)} · Fútbol Mayor</div>
      <h1 class="titulo-inicio">Abrir caja de entradas</h1>
    </div>
    <div class="campo">
      <div class="etiqueta">¿Dónde se juega?</div>
      <div class="dos">
        <button type="button" class="opcion b-lugar" data-accion="condicion" data-valor="local" aria-pressed="${a.condicion === 'local'}">Local</button>
        <button type="button" class="opcion b-lugar" data-accion="condicion" data-valor="visitante" aria-pressed="${a.condicion === 'visitante'}">Visitante</button>
      </div>
      <div class="ayuda">${a.condicion === 'local' ? 'Se vende todo lo que está configurado.' : 'Solo se venden entradas.'}</div>
    </div>
    <div class="campo">
      <label for="rival">Rival</label>
      <input id="rival" type="text" data-campo="rival" value="${esc(a.rival)}" autocomplete="off">
    </div>
    <div class="campo">
      <label for="fondo">Plata para dar vuelto</label>
      <input id="fondo" type="text" inputmode="numeric" data-campo="fondo" value="${esc(a.fondo)}" placeholder="0" autocomplete="off">
    </div>
    <div class="precios">
      <div class="rotulo-panel">Precios de hoy</div>
      ${precios.map((b) => `<div class="fila"><span>${esc(b.nombre)}</span><b>${plata(b.precio)}</b></div>`).join('')}
    </div>
    <div class="error" ${ui.error ? '' : 'hidden'}>${esc(ui.error)}</div>
    <div class="relleno"></div>
    <button type="button" class="boton-grande b-abrir" data-accion="abrirCaja">Abrir caja</button>
    <div class="version">${APP_VERSION}</div>
  </div>`;
}

function botonVenta(b, i, chicos) {
  const q = ui.carrito[b.id] || 0;
  const quitar = `aria-label="Quitar 1 ${esc(b.nombre)}"`;
  if (b.grupo === 'entrada') {
    const c = COLORES_ENTRADA[i % COLORES_ENTRADA.length];
    return `<div class="celda">
      <button type="button" class="b-venta b-entrada${chicos ? ' chico' : ''}" style="--bg: ${c.bg}; --fg: ${c.fg}" data-accion="sumar" data-valor="${esc(b.id)}">
        <span class="nombre">${esc(b.nombre)}</span><span class="precio">${plata(precioDe(b, false))}</span>
      </button>
      ${q ? `<div class="contador">
        <span class="cuenta" style="background: ${c.fg}; color: ${c.claro ? 'var(--tinta)' : '#FFFFFF'}">${q}</span>
        <button type="button" class="menos" style="background: ${c.bg}; color: ${c.fg}; border-color: ${c.fg}" data-accion="restar" data-valor="${esc(b.id)}" ${quitar}>−</button>
      </div>` : ''}
    </div>`;
  }
  if (b.grupo === 'extra') {
    return `<div class="celda">
      <button type="button" class="b-venta b-extra${q ? ' con-cuenta' : ''}" data-accion="sumar" data-valor="${esc(b.id)}">
        <span class="nombre">${esc(b.nombre)}</span><span class="precio">${plata(b.precio)}</span>
      </button>
      ${q ? `<div class="contador vertical chica">
        <span class="cuenta" style="background: var(--tinta); color: #FFFFFF">${q}</span>
        <button type="button" class="menos" style="background: var(--superficie); color: var(--tinta); border-color: var(--tinta)" data-accion="restar" data-valor="${esc(b.id)}" ${quitar}>−</button>
      </div>` : ''}
    </div>`;
  }
  return `<div class="celda">
    <button type="button" class="b-venta b-gratis${q ? ' con-cuenta' : ''}" data-accion="sumar" data-valor="${esc(b.id)}"><span class="nombre">${esc(b.nombre)}</span></button>
    ${q ? `<div class="contador derecha chica">
      <span class="cuenta" style="background: var(--tinta); color: #FFFFFF">${q}</span>
      <button type="button" class="menos" style="background: var(--gratis); color: var(--tinta); border-color: var(--tinta)" data-accion="restar" data-valor="${esc(b.id)}" ${quitar}>−</button>
    </div>` : ''}
  </div>`;
}

function pantallaVender() {
  const botones = botonesParaVender(caja.botones, caja.condicion);
  const de = (g) => botones.filter((b) => b.grupo === g);
  const entradas = de('entrada');
  const extras = de('extra');
  const gratis = de('gratis');
  const chicos = entradas.length > 2;
  const { total, cantidad } = totalCarrito(botones, ui.carrito, false);
  const resumen = botones.filter((b) => ui.carrito[b.id] > 0).map((b) => cantidadDe(ui.carrito[b.id], b.nombre)).join(' · ');
  const personas = calcularCierre(caja, caja.botones).personas;
  const bloqueo = ui.cobrando || cantidad === 0 ? 'disabled' : '';

  return `
  <div class="pantalla">
    <div class="barra">
      <div class="barra-izq">
        <div class="barra-titulo">${esc(partidoTxt(caja.rival))}</div>
        <div class="barra-sub">${condicionTxt(caja.condicion)} · Caja abierta</div>
      </div>
      <button type="button" class="b-alias" data-accion="verAlias">Alias</button>
      <div class="ingresaron"><div class="n">${personas}</div><div class="barra-sub">ingresaron</div></div>
    </div>

    <div class="desplaza zona-botones">
      ${entradas.length ? `<div class="grilla">${entradas.map((b, i) => botonVenta(b, i, chicos)).join('')}</div>` : ''}
      ${extras.length ? `<div class="grilla">${extras.map((b, i) => botonVenta(b, i)).join('')}</div>` : ''}
      ${gratis.length ? `<div>
        <div class="rotulo" style="padding-bottom: 6px; letter-spacing: 0.06em">No pagan entrada</div>
        <div class="grilla una">${gratis.map((b, i) => botonVenta(b, i)).join('')}</div>
      </div>` : ''}
    </div>

    <div class="franja">
      <div class="franja-izq">
        <div class="resumen">${cantidad ? esc(resumen) : 'Tocá lo que te piden'}</div>
        <div class="total">${plata(total)}</div>
      </div>
      ${cantidad ? '<button type="button" class="b-chico" data-accion="borrar">Borrar</button>' : ''}
    </div>
    ${ui.error ? `<div class="vender-error"><div class="error">${esc(ui.error)}</div></div>` : ''}
    ${cantidad > 0 && total === 0
      ? `<div class="cobrar">
          <button type="button" class="boton-grande b-oscuro" data-accion="cobrar" data-valor="efectivo" ${bloqueo}>Anotar sin cargo</button>
        </div>`
      : `<div class="cobrar dos">
          <button type="button" class="boton-grande b-efectivo" data-accion="cobrar" data-valor="efectivo" ${bloqueo}>Efectivo</button>
          <button type="button" class="boton-grande b-oscuro b-transf" data-accion="cobrar" data-valor="transferencia" ${bloqueo}>Transferencia</button>
        </div>`}
  </div>`;
}

function ticketHtml(t, venta) {
  return `<div class="ticket">
    <div class="fuerte">${esc(config.club.toUpperCase())}</div>
    <div>${esc(partidoTxt(caja.rival))}</div>
    <div class="t-titulo">${esc(t.titulo)}</div>
    ${t.detalle ? `<div class="t-detalle">${esc(t.detalle)}</div>` : ''}
    ${t.cuerpo.length ? `<div class="t-cuerpo">${t.cuerpo.map((c) => `<div><span>${esc(c.texto)}</span><span>${esc(c.monto)}</span></div>`).join('')}</div>` : ''}
    ${t.total > 0 ? `<div class="t-precio">${t.clase === 'combinado' ? 'TOTAL ' : ''}${plata(t.total)}</div>` : ''}
    <div class="t-pie">${fechaHoraTxt(venta.fechaHora)}</div>
    <div>N° ${numeroTicket(t.numero)} · ${MEDIOS[venta.medio]}</div>
  </div>`;
}

function panelCobrado() {
  const v = caja.ventas.find((x) => x.id === ui.cobrada);
  if (!v) return '';
  const n = v.tickets.length;
  const avisos = avisosDeVenta(v);
  const efectivo = v.medio === 'efectivo' && v.total > 0;
  return `
  <div class="velo">
    <div class="panel">
      <div class="cobrado-cabeza">
        <div class="izq">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#1C6B43"></circle><path d="M10 18.5l5.5 5.5L26 13" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div>
            <div class="panel-titulo">${v.total ? 'Cobrado' : 'Anotado'}</div>
            <div class="medio">${MEDIOS[v.medio]}</div>
          </div>
        </div>
        <div class="monto">${plata(v.total)}</div>
      </div>
      ${n ? `<div>
        <div class="etiqueta-2" style="padding-bottom: 8px">${n === 1 ? 'Entregá 1 ticket de papel' : 'Entregá ' + n + ' tickets de papel'}</div>
        <div class="tickets">${v.tickets.map((t) => ticketHtml(t, v)).join('')}</div>
      </div>` : ''}
      ${avisos.length ? `<div class="notas">${avisos.map((a) => `<div class="nota">${esc(a)}</div>`).join('')}</div>` : ''}
      ${v.medio === 'transferencia' ? `<div class="campo">
        <label for="pagador">¿Quién transfirió?</label>
        <input id="pagador" type="text" data-campo="pagador" value="${esc(v.pagador)}" placeholder="Nombre (opcional)" autocomplete="off">
        <div class="error" id="error-pagador" hidden>No se pudo guardar el nombre. La venta quedó guardada.</div>
      </div>` : ''}
      ${efectivo ? `<div class="campo">
        <div class="etiqueta-2">¿Con cuánto paga?</div>
        <div class="tres">${sugerenciasDePago(v.total).map((b) =>
          `<button type="button" class="opcion chip" data-accion="pagaCon" data-valor="${b}" aria-pressed="${ui.pagaCon === b}">${plata(b)}</button>`).join('')}</div>
        ${ui.pagaCon > v.total ? `<div class="renglon-gris"><span>Vuelto</span><span class="condensada">${plata(ui.pagaCon - v.total)}</span></div>` : ''}
      </div>` : ''}
      <button type="button" class="boton-grande b-siguiente" data-accion="siguiente">Siguiente</button>
    </div>
  </div>`;
}

function panelAlias() {
  const t = config.transf;
  const { total } = totalCarrito(caja.botones, ui.carrito, false);
  return `
  <div class="velo" style="z-index: 6">
    <div class="panel" style="padding-top: 22px">
      <div class="panel-titulo">Datos para transferir</div>
      ${total > 0 ? `<div class="renglon-gris"><span>A transferir</span><span class="condensada" style="font-size: 40px">${plata(total)}</span></div>` : ''}
      ${t.alias ? `
        <div class="dato"><div class="que">Alias</div><div class="alias">${esc(t.alias)}</div></div>
        ${t.titular ? `<div class="dato"><div class="que">A nombre de</div><div class="valor">${esc(t.titular)}</div></div>` : ''}
        ${t.banco ? `<div class="dato"><div class="que">Banco o billetera</div><div class="valor">${esc(t.banco)}</div></div>` : ''}`
      : '<div class="nota">Todavía no se cargó el alias. Se carga en Configurar, con la caja cerrada.</div>'}
      <button type="button" class="boton-grande b-cerrar-panel" data-accion="cerrarAlias">Cerrar</button>
    </div>
  </div>`;
}

function render() {
  const zona = app.querySelector('.zona-botones');
  const scroll = zona ? zona.scrollTop : 0;
  let html = caja ? pantallaVender() : pantallaAbrir();
  if (caja && ui.cobrada) html += panelCobrado();
  else if (caja && ui.alias) html += panelAlias();
  app.innerHTML = html;
  const nueva = app.querySelector('.zona-botones');
  if (nueva) nueva.scrollTop = scroll;
}

// ---------- Acciones ----------

const acciones = {
  condicion(v) { ui.abrir.condicion = v; },
  abrirCaja() {
    const a = ui.abrir;
    const nueva = nuevaCaja({ condicion: a.condicion, rival: a.rival.trim(), fondo: soloNumero(a.fondo), botones: config.botones, ahora: ahora() });
    if (!G.guardarCaja(nueva)) { ui.error = 'No se pudo abrir la caja. Probá de nuevo.'; return; }
    caja = nueva;
    ui.abrir = { condicion: 'local', rival: '', fondo: '' };
    ui.carrito = {};
    ui.error = '';
    pantallaEncendida();
  },
  sumar(id) { ui.carrito[id] = (ui.carrito[id] || 0) + 1; ui.error = ''; },
  restar(id) { ui.carrito[id] = Math.max(0, (ui.carrito[id] || 0) - 1); },
  borrar() { ui.carrito = {}; },
  cobrar(medio) {
    if (ui.cobrando) return;
    ui.cobrando = true;
    const r = armarVenta(caja.botones, ui.carrito, {
      id: caja.ventas.length + 1, medio, socio: false, ultimoTicket: caja.ultimoTicket, ahora: ahora()
    });
    if (!r) { ui.cobrando = false; return; }
    const nueva = Object.assign({}, caja, { ventas: caja.ventas.concat([r.venta]), ultimoTicket: r.ultimoTicket });
    // Se guarda antes de mostrar nada: la venta no depende de ningún paso posterior.
    if (!G.guardarCaja(nueva)) {
      ui.cobrando = false;
      ui.error = 'No se pudo guardar la venta. Probá de nuevo.';
      return;
    }
    caja = nueva;
    ui.carrito = {};
    ui.cobrada = r.venta.id;
    ui.pagaCon = 0;
    ui.alias = false;
    ui.error = '';
  },
  pagaCon(v) { ui.pagaCon = Number(v); },
  siguiente() { ui.cobrada = null; ui.cobrando = false; ui.pagaCon = 0; },
  verAlias() { ui.alias = true; },
  cerrarAlias() { ui.alias = false; }
};

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-accion]');
  if (!el || el.disabled) return;
  // Bloquear los botones de cobrar apenas se tocan, antes de cualquier otra cosa.
  if (el.dataset.accion === 'cobrar') app.querySelectorAll('[data-accion="cobrar"]').forEach((b) => { b.disabled = true; });
  acciones[el.dataset.accion](el.dataset.valor);
  render();
});

// Los campos no redibujan la pantalla al escribir, para no perder el foco.
app.addEventListener('input', (e) => {
  const campo = e.target.dataset.campo;
  if (campo === 'rival' || campo === 'fondo') ui.abrir[campo] = e.target.value;
  if (campo === 'pagador' && caja) {
    const nombre = e.target.value;
    const nueva = Object.assign({}, caja, {
      ventas: caja.ventas.map((v) => (v.id === ui.cobrada ? Object.assign({}, v, { pagador: nombre }) : v))
    });
    const ok = G.guardarCaja(nueva);
    if (ok) caja = nueva;
    const err = document.getElementById('error-pagador');
    if (err) err.hidden = ok;
  }
});

// Que la pantalla no se apague con la caja abierta, si el navegador lo permite.
let candado = null;
async function pantallaEncendida() {
  if (!caja || candado || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try {
    candado = await navigator.wakeLock.request('screen');
    candado.addEventListener('release', () => { candado = null; });
  } catch (e) { /* sin permiso: sigue igual */ }
}
document.addEventListener('visibilitychange', pantallaEncendida);

render();
pantallaEncendida();

// Pedir que el navegador no borre los datos por su cuenta.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then((ya) => { if (!ya) navigator.storage.persist(); }).catch(() => {});
}

// Service worker: abre con lo guardado. Si hay una versión nueva, avisa y
// se actualiza solo cuando la persona toca el aviso (nunca en medio de una venta).
if ('serviceWorker' in navigator) {
  const aviso = document.getElementById('aviso-version');
  let pidioActualizar = false;

  const mostrarAviso = (sw) => {
    aviso.hidden = false;
    aviso.onclick = () => { pidioActualizar = true; sw.postMessage('actualizar'); };
  };

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (pidioActualizar) location.reload();
  });

  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
    if (reg.waiting && navigator.serviceWorker.controller) mostrarAviso(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nuevo = reg.installing;
      if (!nuevo) return;
      nuevo.addEventListener('statechange', () => {
        if (nuevo.state === 'installed' && navigator.serviceWorker.controller) mostrarAviso(nuevo);
      });
    });
    // Buscar versión nueva cada vez que se vuelve a la app.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
    });
  }).catch(() => {});
}
</script>
